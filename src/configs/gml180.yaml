general:
  data_path: ./data/
  train_data: train_japan_backtranslation_filtered.csv
  val_data: dev.csv
  test_data: test.csv
  model_name: digit82/kobart-summarization
  output_dir: ./checkpoint/

inference:
  batch_size: 48
  ckt_path: model-ckt-path
  ckt_dir: ./checkpoint/
  early_stopping: true
  generate_max_length: 180
  no_repeat_ngram_size: 2
  num_beams: 4
  remove_tokens:
    - <usr>
    - <s>
    - </s>
    - <pad>
  result_path: ./prediction/
  length_penalty: 1.0

tokenizer:
  bos_token: <s>
  decoder_max_len: 200
  encoder_max_len: 512
  eos_token: </s>
  special_tokens:
    - '#Person1#'
    - '#Person2#'
    - '#Person3#'
    - '#Person4#'
    - '#Person5#'
    - '#Person6#'
    - '#Person7#'
    - '#Name#'
    - '#PersonName#'
    - '#Alex#'
    - '#Bob#'
    - '#Kristin#'
    - '#Liliana#'
    - '#Mike#'
    - '#Address#'
    - '#PhoneNumber#'
    - '#DateOfBirth#'
    - '#PassportNumber#'
    - '#SSN#'
    - '#CardNumber#'
    - '#CarNumber#'
    - '#Email#'
    - '#FlightNumber#'
    - '#Price#'

training:
  dataloader_drop_last: false
  dataloader_num_workers: 8
  early_stopping_patience: 1
  early_stopping_threshold: 0.001
  eval_steps: 400
  evaluation_strategy: steps
  fp16: true
  generation_max_length: 200
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  group_by_length: true
  learning_rate: 1.0e-05
  load_best_model_at_end: true
  logging_steps: 100
  num_train_epochs: 20
  output_dir: ./checkpoint/
  overwrite_output_dir: false
  per_device_eval_batch_size: 48
  per_device_train_batch_size: 64
  predict_with_generate: true
  remove_unused_columns: true
  report_to: all
  save_steps: 400
  save_total_limit: 1
  seed: 42
  torch_empty_cache_steps: 10
  warmup_steps: 10
  weight_decay: 0.01

wandb:
  entity: upstage_13
  project: nlp5-eunbyul
  name: 